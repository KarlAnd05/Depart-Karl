<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Puzzle · Depart Karl</title>
  <meta name="description" content="Rebuild a randomly chosen photo by swapping its puzzle pieces.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Depart Karl">
  <meta property="og:title" content="Photo Puzzle">
  <meta property="og:description" content="Rebuild a randomly chosen photo by swapping its puzzle pieces.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/puzzle.js"></script>
</head>
<body data-page="puzzle">
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <h1>Photo Puzzle</h1>
    <p class="lead">Rebuild the photo. Tap two pieces to swap them, or drag a piece onto another.</p>

    <div class="toolbar">
      <label class="inline">Pieces
        <select id="difficulty">
          <option value="3">3 × 3 · Easy</option>
          <option value="4" selected>4 × 4 · Medium</option>
          <option value="5">5 × 5 · Hard</option>
          <option value="6">6 × 6 · Expert</option>
        </select>
      </label>
      <button id="new-photo" class="btn btn-primary" type="button">New photo</button>
      <button id="reshuffle" class="btn" type="button">Reshuffle</button>
      <button id="peek" class="btn" type="button">Peek</button>
    </div>

    <p id="status" class="notice" role="status"></p>
    <div id="puzzle" hidden></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
