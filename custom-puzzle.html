<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Puzzle · Depart Karl</title>
  <meta name="description" content="Turn any photo from your device into a puzzle and solve it in your browser.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Depart Karl">
  <meta property="og:title" content="Custom Photo Puzzle">
  <meta property="og:description" content="Turn any photo from your device into a puzzle and solve it in your browser.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/custom-puzzle.js"></script>
</head>
<body data-page="custom-puzzle">
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <h1>Custom Photo Puzzle</h1>
    <p class="lead">Turn your own photo into a puzzle. It stays on your device and is never uploaded.</p>

    <div class="toolbar">
      <label class="btn btn-primary file-btn">
        Choose photo
        <input id="photo-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      </label>
      <label class="inline">Pieces
        <select id="difficulty">
          <option value="3">3 × 3 · Easy</option>
          <option value="4" selected>4 × 4 · Medium</option>
          <option value="5">5 × 5 · Hard</option>
          <option value="6">6 × 6 · Expert</option>
        </select>
      </label>
      <button id="reshuffle" class="btn" type="button" disabled>Reshuffle</button>
      <button id="peek" class="btn" type="button" disabled>Peek</button>
    </div>

    <p id="status" class="notice" role="status"></p>

    <div id="dropzone" class="empty-state">
      <p><strong>Choose a photo</strong> or drop one here to start.</p>
      <p class="hint">JPEG, PNG, WebP or GIF · any shape or size</p>
    </div>
    <div id="puzzle" hidden></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
