<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku · Depart Karl</title>
  <meta name="description" content="Play Sudoku online at three difficulty levels.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Depart Karl">
  <meta property="og:title" content="Sudoku">
  <meta property="og:description" content="Play Sudoku online at three difficulty levels.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/pages/sudoku.js"></script>
</head>
<body data-page="sudoku">
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="sudoku-panel">
      <h1>Sudoku</h1>
      <p class="lead">Fill every row, column and 3×3 box with the numbers 1–9. Tap a cell, then pick a number.</p>

      <div class="toolbar">
        <label class="inline">Level
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button id="new-game" class="btn btn-primary" type="button">New game</button>
        <button id="undo" class="btn" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
        <button id="restart" class="btn" type="button">Restart</button>
        <button id="check" class="btn" type="button">Check</button>
      </div>

      <div id="sudoku"></div>
      <p id="sudoku-message" class="notice sudoku-message" role="status"></p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
